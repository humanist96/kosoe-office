<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>코쇠오피스</title>
<link rel="icon" href="/static/kosoe.webp">
<style id="base-css">
@font-face{font-family:KoPub;font-weight:700;src:url(/static/KoPubDotum-Bold.woff2) format('woff2')}
@font-face{font-family:KoPub;font-weight:500;src:url(/static/KoPubDotum-Medium.woff2) format('woff2')}
:root{--o:#ee6d1d;--o2:#f26522;--op:#fdeee4;--n:#00338d;--n2:#1f4b9b;--nt:#edf4fb;--ink:#2b2b2e;--ink2:#6e6e73;--g:#ececee;--g2:#f5f5f7;--line:#dcdce0;
 --ok:#1f7a4d;--okt:#e7f4ec;--warn:#b85415;--bad:#c0392b;--badt:#fbeceb;--r:12px;--sh:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,30,80,.06)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--g2);color:var(--ink);font:500 14px/1.55 KoPub,'Malgun Gothic',sans-serif;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--n);text-decoration:none}a:hover{text-decoration:underline}
b,strong,h1,h2,h3,h4{font-weight:700}
h1,h2,h3,h4{margin:0}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:9px;background:var(--n);color:#fff;font-weight:700;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--n2);transform:translateY(-1px)}
.btn.o{background:var(--o)}.btn.o:hover{background:var(--o2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--n);color:var(--n)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:7px}
.btn.red{background:#fff;color:var(--bad);border:1px solid #e9b8b3}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.in{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none;transition:.15s}
.in:focus{border-color:var(--n);box-shadow:0 0 0 3px rgba(0,51,141,.1)}
textarea.in{resize:vertical;min-height:40px}
.card{background:#fff;border:1px solid var(--g);border-radius:var(--r);box-shadow:var(--sh)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--g2);color:var(--ink2);border:1px solid var(--g);white-space:nowrap}
.chip.n{background:var(--nt);color:var(--n);border-color:#d3e2f3}.chip.o{background:var(--op);color:var(--warn);border-color:#f7d3bc}
.chip.ok{background:var(--okt);color:var(--ok);border-color:#c7e6d3}.chip.bad{background:var(--badt);color:var(--bad);border-color:#f0c9c5}
.chip.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.muted{color:var(--ink2)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:8px}.col{display:flex;flex-direction:column;gap:8px}.grow{flex:1;min-width:0}
.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.chev{display:inline-block;width:.62em;height:.8em;background:var(--o);clip-path:polygon(0 0,58% 0,100% 50%,58% 100%,0 100%,42% 50%)}
/* 로그인 */
#login{min-height:100%;display:grid;grid-template-columns:1.05fr 1fr;background:#fff}
#login .l{background:var(--n);color:#fff;padding:64px 56px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
#login .l .bg{position:absolute;right:-60px;top:90px;display:flex;gap:0}
#login .l .bg i{width:180px;height:340px;clip-path:polygon(0 0,58% 0,100% 50%,58% 100%,0 100%,42% 50%);margin-left:-60px;animation:slide 6s ease-in-out infinite}
#login .l .bg i:nth-child(1){background:#1f4b9b}#login .l .bg i:nth-child(2){background:var(--o);animation-delay:.3s}#login .l .bg i:nth-child(3){background:#f6a26c;animation-delay:.6s}
@keyframes slide{50%{transform:translateX(14px)}}
#login .l img{width:120px;position:relative;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
#login h1{font-size:44px;line-height:1.15;margin:22px 0 12px;position:relative}
#login .l p{opacity:.85;max-width:430px;position:relative;font-size:15px}
#login .r{padding:56px;display:flex;flex-direction:column;justify-content:center;gap:14px}
.persona{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--g);border-radius:12px;text-align:left;transition:.15s;background:#fff}
.persona:hover{border-color:var(--o);box-shadow:var(--sh);transform:translateX(4px)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.status{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
/* 앱 */
#app{display:grid;grid-template-rows:58px 1fr;grid-template-columns:220px 1fr;height:100%}
#top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 18px;background:#fff;border-bottom:1px solid var(--g);z-index:5}
#top .logo{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;width:190px}
#top .logo img{width:30px}
.net{display:flex;background:var(--g2);border:1px solid var(--g);border-radius:10px;padding:3px}
.net button{padding:5px 13px;border-radius:7px;font-weight:700;color:var(--ink2);font-size:13px}
.net button.on{background:var(--n);color:#fff}.net button.on.i{background:var(--o)}
#side{background:#fff;border-right:1px solid var(--g);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
#side a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--ink);font-weight:700;text-decoration:none}
#side a:hover{background:var(--g2)}#side a.on{background:var(--nt);color:var(--n)}
#side a .ic{width:20px;text-align:center}
#side a .badge{margin-left:auto;background:var(--o);color:#fff;border-radius:99px;font-size:11px;padding:0 7px}
#side .sec{font-size:11px;color:var(--ink2);padding:14px 12px 4px;letter-spacing:.04em}
#main{overflow:auto;padding:26px 30px 60px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-h h2{font-size:23px}.page-h p{margin:4px 0 0;color:var(--ink2)}
/* 새 문서 */
.ask{padding:22px;border-radius:16px;background:linear-gradient(135deg,#fff 60%,var(--op));border:1px solid var(--g);box-shadow:var(--sh)}
.ask textarea{border:0;outline:0;width:100%;font-size:18px;resize:none;background:transparent;min-height:64px}
.files{display:flex;gap:6px;flex-wrap:wrap}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tpl{padding:15px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:8px;position:relative}
.tpl:hover{border-color:var(--n2);transform:translateY(-2px)}
.tpl.sel{border:2px solid var(--o);padding:14px;background:#fffaf6}
.tpl.dis{opacity:.5;cursor:not-allowed}
.tpl .ol{font-size:12px;color:var(--ink2)}
.fmt{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;color:#fff}
.fmt.hwp{background:#2f74c0}.fmt.ppt{background:#d24726}.fmt.web{background:#1f7a4d}
.rec{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--nt);border:1px solid #d3e2f3;border-radius:12px;margin-top:14px}
/* 작업 화면 */
.ws{display:grid;grid-template-columns:330px 1fr 300px;gap:14px;height:calc(100vh - 58px - 150px)}
.panel{display:flex;flex-direction:column;min-height:0}
.panel>.hd{padding:12px 14px;border-bottom:1px solid var(--g);display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel>.bd{padding:14px;overflow:auto;flex:1;min-height:0}
.msg{max-width:92%;padding:9px 12px;border-radius:12px;margin-bottom:10px;white-space:pre-wrap}
.msg.me{background:var(--n);color:#fff;margin-left:auto;border-bottom-right-radius:3px}
.msg.ai{background:var(--g2);border-bottom-left-radius:3px}
.msg .meta{display:block;margin-top:5px;font-size:11px;color:var(--ink2)}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px 0}
.quick button{font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:99px;background:#fff}
.quick button:hover{border-color:var(--o);color:var(--o)}
.sec-ed{border:1px solid var(--g);border-radius:10px;padding:12px;margin-bottom:12px;background:#fff;transition:.2s}
.sec-ed:hover{border-color:#cdd8ea}
.sec-ed .h{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sec-ed .h .no{color:var(--o);font-weight:700;width:24px}
.sec-ed .h input{font-weight:700;font-size:15px;border:0;border-bottom:1px dashed transparent;padding:3px 2px;outline:0;flex:1}
.sec-ed .h input:focus{border-bottom-color:var(--n)}
.item{display:grid;grid-template-columns:96px 1fr 26px;gap:6px;margin-bottom:6px;align-items:start}
.item.child{grid-template-columns:20px 1fr 26px;margin-left:96px}
.item input,.item textarea{padding:6px 8px;border:1px solid var(--g);border-radius:7px;outline:0;background:var(--g2)}
.item input:focus,.item textarea:focus{border-color:var(--n);background:#fff}
.item textarea{resize:none;min-height:34px;overflow:hidden;width:100%;display:block;line-height:1.45}
.item .cnt{font-size:10.5px;color:var(--ink2);text-align:right;margin-top:-2px}
.item .cnt.over{color:var(--bad);font-weight:700}
.x{color:#aaa;font-size:16px;line-height:1;padding:6px 4px}.x:hover{color:var(--bad)}
.tbl-ed{overflow:auto;margin:6px 0}
.tbl-ed table{border-collapse:collapse;font-size:12.5px;width:100%}
.tbl-ed td,.tbl-ed th{border:1px solid var(--line);padding:5px 7px;min-width:60px;outline:0}
.tbl-ed th{background:var(--n);color:#fff}
.tbl-ed td:focus,.tbl-ed th:focus{box-shadow:inset 0 0 0 2px var(--o)}
.check{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--g);font-size:13px}
.check .i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;flex:none;margin-top:2px}
.check .i.ok{background:var(--ok)}.check .i.no{background:var(--o)}
.out-f{border:1px solid var(--g);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.fmtpick{display:flex;gap:6px}
.fmtpick label{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 6px;text-align:center;cursor:pointer;font-weight:700;font-size:13px;user-select:none}
.fmtpick input{display:none}.fmtpick input:checked+span{color:var(--n)}
.fmtpick label:has(input:checked){border-color:var(--n);background:var(--nt)}
/* 표 · 목록 */
table.list{width:100%;border-collapse:collapse;background:#fff}
table.list th{text-align:left;font-size:12px;color:var(--ink2);padding:10px 12px;border-bottom:1px solid var(--g);font-weight:700;background:var(--g2)}
table.list td{padding:11px 12px;border-bottom:1px solid var(--g);vertical-align:middle}
table.list tr.click:hover td{background:#fafbfd;cursor:pointer}
.perm{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.perm.m{background:var(--n);color:#fff}.perm.w{background:var(--o);color:#fff}.perm.r{background:var(--g);color:var(--ink)}.perm.audit{background:#e8e0f5;color:#5a3d8a}
.grade{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;border:1px solid}
.grade.c{color:var(--bad);border-color:#e9b8b3;background:var(--badt)}.grade.i{color:var(--n);border-color:#c5d5ee;background:var(--nt)}.grade.n{color:var(--ink2);border-color:var(--line)}
.pipe{display:flex;align-items:center;gap:0;margin:8px 0}
.pipe .st{padding:5px 14px 5px 18px;font-size:12px;font-weight:700;background:var(--g);color:var(--ink2);clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%,9px 50%);margin-right:-4px}
.pipe .st:first-child{clip-path:polygon(0 0,calc(100% - 9px) 0,100% 50%,calc(100% - 9px) 100%,0 100%);padding-left:12px}
.pipe .st.done{background:var(--ok);color:#fff}.pipe .st.now{background:var(--o);color:#fff}.pipe .st.rej{background:var(--bad);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{padding:16px 18px}.kpi .v{font-size:28px;font-weight:700;color:var(--n);line-height:1.2}.kpi .v small{font-size:14px;color:var(--ink2)}
.kpi .l{color:var(--ink2);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.box{padding:16px 18px}.box h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
pre.code{background:#0f1b33;color:#d6e2ff;padding:14px;border-radius:10px;font:12.5px/1.6 Consolas,monospace;overflow:auto;white-space:pre-wrap;margin:0}
.ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--g);font-size:13px}.ev .t{color:var(--ink2);width:82px;flex:none}.ev .w{font-weight:700;width:64px;flex:none}
/* 모달 · 알림 */
#modal{position:fixed;inset:0;background:rgba(10,20,40,.45);display:grid;place-items:center;z-index:50;padding:20px}
#modal .mbox{background:#fff;border-radius:16px;width:min(760px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.3)}
#modal .mbox.wide{width:min(1180px,100%)}
#modal .mh{padding:16px 20px;border-bottom:1px solid var(--g);display:flex;justify-content:space-between;align-items:center}
#modal .mb{padding:18px 20px;overflow:auto}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}
#toast div{background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);animation:up .25s ease}
#toast div.err{background:var(--bad)}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:grid;place-items:center;z-index:70;backdrop-filter:blur(2px)}
.busy .b{background:#fff;padding:22px 30px;border-radius:14px;box-shadow:var(--sh);display:flex;align-items:center;gap:14px;font-weight:700}
.busy img{width:46px;animation:bob 1s ease-in-out infinite}
.hwpv{background:#f0f0f0;padding:20px;border-radius:10px}
.hwpv .pg{background:#fff;max-width:640px;margin:auto;padding:46px 54px;box-shadow:0 4px 18px rgba(0,0,0,.12);font-family:'Malgun Gothic',serif;font-size:13px}
.hwpv .t{font-size:20px;font-weight:700;text-align:center;border:2px solid #333;padding:10px;margin-bottom:6px}
.hwpv .s{font-weight:700;font-size:15px;margin:14px 0 6px}
.hwpv .p{margin:3px 0 3px 10px}
.shots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.shots img{width:100%;border-radius:6px;border:1px solid var(--g)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--ink2);transition:.15s;cursor:pointer}
.drop:hover,.drop.on{border-color:var(--o);background:#fffaf6;color:var(--o)}
.lst-ed .li{display:flex;gap:6px;margin-bottom:6px}
.empty{padding:40px;text-align:center;color:var(--ink2)}
.empty img{width:70px;opacity:.85}
@media (max-width:1100px){.ws{grid-template-columns:1fr;height:auto}.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}#login{grid-template-columns:1fr}}

.chain{display:inline-flex;flex-wrap:wrap;gap:4px;align-items:center}.chain i{color:var(--ink2);font-style:normal}
.chain .cn{padding:2px 7px;border-radius:5px;background:#f1f1f3;font-size:12px}.chain .cn.corp{background:#e8eef9;color:var(--n)}.chain .cn.me{background:var(--op);color:var(--o);font-weight:700}
.inh{display:flex;flex-direction:column;gap:4px}.inh .lv{padding:6px 10px;border-left:4px solid #c9c9cf;background:#fafafa;font-size:13px}
.inh .lv.corp{border-color:var(--n);background:#f2f5fb}.inh .lv.me{border-color:var(--o);background:var(--op)}.inh .lv b{margin-right:6px}
.hl-legend{display:flex;gap:8px;margin:8px 0}.hl-doc{margin-top:6px}.hl-doc summary{cursor:pointer;font-size:13px}.hl-body{max-height:240px;overflow:auto;padding:6px;border:1px solid var(--g);border-radius:8px;margin-top:4px}
.hl{font-size:12.5px;padding:1px 4px;border-radius:3px;margin:1px 0}.hl.fixed{background:#fde3d2}.hl.head{color:var(--n);font-weight:700}.hl.var{text-decoration:underline dotted var(--o)}
.hl-legend .hl{display:inline-block}
</style>
<style id="theme-picker-css">
/* 엑셀 형식 표시 · 엑셀 미리보기 — 화면 테마 CSS(themes/*)에는 없는 규칙이라 늘 실리는 이 블록에 둔다 */
.fmt.xlsx{background:#1d6f42;color:#fff}
.xlv-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.xlv{overflow:auto;max-height:70vh;padding:18px;border-radius:8px;background:#e4e6e9}
.xlv-page{box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;line-height:1.25}
/* 파일 끌어 놓기 강조 — 테마 CSS가 기본 CSS를 대신하므로 늘 실리는 이 블록에 둔다 */
.dz-on{outline:2px dashed var(--o,#F06E1E);outline-offset:4px}
.dz-on .drop{border-color:var(--o,#F06E1E);color:var(--o,#F06E1E)}
/* 화면 테마 고르기 — 어느 테마에서도 보이도록 테마 CSS와 따로 둔다 */
.theme-pick{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
.theme-pick svg{width:14px;height:14px;flex:none}
#login .theme-pick.login{align-self:flex-start;margin-top:14px;padding:4px 0;border:0;background:none;color:inherit;font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:3px;opacity:.75}
#login .theme-pick.login:hover{opacity:1}
.theme-note{margin:0 0 14px;opacity:.75}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.theme-card{display:flex;flex-direction:column;gap:4px;padding:0 0 12px;border:1px solid rgba(128,128,128,.35);border-radius:8px;overflow:hidden;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.theme-card img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-bottom:1px solid rgba(128,128,128,.25);margin-bottom:6px}
.theme-card b,.theme-card span{padding:0 12px}
.theme-card span{font-size:12.5px;opacity:.75}
.theme-card small{margin-left:5px;font-size:11px;font-weight:700;color:#F06E1E}
.theme-card:hover,.theme-card:focus-visible{border-color:#F06E1E}
.theme-card.on{outline:2px solid #F06E1E;outline-offset:-2px}
/* 문서 테마 고르기 — PPT·웹슬라이드를 만들 때 고르는 디자인 9가지 */
.dth-row{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:8px 10px;border:1px solid rgba(128,128,128,.35);border-radius:8px;background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.dth-row:hover,.dth-row:focus-visible{border-color:#F06E1E}
.dth-row img{width:64px;height:36px;object-fit:cover;border-radius:4px;border:1px solid rgba(128,128,128,.25);flex:none}
.dth-row .nm{flex:1;min-width:0;line-height:1.35}
.dth-row .nm small{display:block;font-size:11px;opacity:.7}
.dth-row .nm b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dth-row .chg{font-size:12px;font-weight:700;color:#F06E1E;white-space:nowrap}
.dth-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.dth-card .two{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(128,128,128,.25);border-bottom:1px solid rgba(128,128,128,.25);margin-bottom:6px}
.dth-card .two figure{margin:0;position:relative}
.dth-card .two img{aspect-ratio:16/9;margin:0;border:0}
.dth-card .two figcaption{position:absolute;left:6px;bottom:6px;padding:1px 6px;border-radius:3px;font-size:10.5px;font-weight:700;background:rgba(0,0,0,.6);color:#fff}
</style>
<script>

async function api(path, opt = {}) {

function selTpl(id) {

const ACCEPT = '.xlsx,.xlsm,.pptx,.docx,.pdf,.hwp,.hwpx,.html,.htm,.csv,.txt,.md,.pia';
async function eachFile(files, cb) {               // 한 파일이 실패해도 나머지는 올린다(실패 사유는 api()가 이미 토스트로 보여 줌)

function pickFile(cb, multi) {
  const i = document.createElement('input'); i.type = 'file'; i.multiple = !!multi; i.accept = ACCEPT;
  i.onchange = () => eachFile([...i.files], cb); i.click();
}
// 끌어 놓을 수 있는 곳 — 위에서부터 먼저 맞는 것. 동작은 같은 화면의 📎 버튼과 똑같다.
// document에 한 번만 건다: 화면을 innerHTML로 다시 그려도, 테마가 화면 함수를 덮어써도 class · id만 맞으면 동작한다.
const DROPS = [
  ['#sbIn', f => sbAdd(f)],                                                // ★ 스킬 만들기 — 대표 문서 카드
  ['.ask', f => addAtt(f)],                                                // 새 문서 — 요청 칸(기본 · 테마 공통 class)
  ['#wsChat', async f => { CATT.push(await upload(f)); renderCatt(); }],   // 작업 화면 — 채팅 첨부
  ['#inSrc', async f => { IN.src.push(await upload(f)); vInspect(); }],    // 검수 — 원본 파일
  ['#inTgt', async f => { IN.tgt.push(await upload(f)); vInspect(); }],    // 검수 — 대상 파일
];
let dzEl = null;
const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
function dzOf(t) {
  for (const [sel, cb] of DROPS) { const el = t?.closest?.(sel); if (el) return {el, cb}; }
  return {el: null, cb: null};
}
function dzMark(el) { if (dzEl === el) return; dzEl?.classList.remove('dz-on'); dzEl = el; el?.classList.add('dz-on'); }
document.addEventListener('dragover', e => {
  if (!hasFiles(e)) return;                        // 글자 · 링크 끌기는 건드리지 않는다
  e.preventDefault();                              // 이게 없으면 영역 밖에 놓을 때 브라우저가 파일을 열어 화면을 떠난다
  const {el} = dzOf(e.target);
  e.dataTransfer.dropEffect = el ? 'copy' : 'none';   // 놓을 수 없는 곳은 🚫 커서, drop 자체가 일어나지 않는다
  dzMark(el);
});
document.addEventListener('dragleave', e => { if (!e.relatedTarget) dzMark(null); });   // 창 밖으로 나감
document.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dzMark(null);
  const files = [...e.dataTransfer.files];         // await 전에 복사 — 이벤트가 끝나면 목록이 빌 수 있다
  const {cb} = dzOf(e.target);
  if (cb) eachFile(files, cb);
});
async function upload(f) {

  else toast(`${u.name}: 표 ${u.tables.length}개 · 장 제목 ${u.heads.length}개 읽음`);
  return u;
}

async function startCompose() {

     <img src="/static/themes/${id}/thumb.webp" alt=""><b>${name}${id === cur ? '<small>사용 중</small>' : ''}</b><span>${desc}</span></button>`).join('')}</div>`, true);
}
function setTheme(id) {
  if (id === window.KOSOE_THEME) return closeModal();
  try { localStorage.setItem('kosoe.theme', id); } catch (e) { return toast('이 브라우저는 테마를 저장할 수 없습니다', true); }
  const u = new URL(location.href); u.searchParams.delete('theme'); location.replace(u);
}
// 테마가 renderTop/showLogin 을 바꿔도 '테마' 버튼이 늘 붙도록, 테마 스크립트를 실은 뒤에 감싼다
function addThemeButtons() {
  const rt = renderTop, sl = showLogin;
  renderTop = function () {
    rt.apply(this, arguments);
    const top = $('#top');
    if (!top || top.querySelector('.theme-pick')) return;
    const b = document.createElement('button');
    b.className = 'chip theme-pick'; b.title = '화면 테마 바꾸기'; b.onclick = themeModal;
    b.innerHTML = PALETTE_ICON + '테마';
    top.insertBefore(b, top.lastElementChild);
  };
  showLogin = async function () {
    await sl.apply(this, arguments);
    const r = $('#login .r');
    if (r && !r.querySelector('.theme-pick')) r.insertAdjacentHTML('beforeend', `<button class="theme-pick login" onclick="themeModal()">${PALETTE_ICON}화면 테마 바꾸기</button>`);
  };
}
function start() {
  const run = () => { addThemeButtons(); boot(); };
  if (window.KOSOE_THEME === 'base') return run();
  const s = document.createElement('script');
  s.src = `/static/themes/${window.KOSOE_THEME}/theme.js`;
  s.onload = run;
  s.onerror = () => { run(); toast('테마 스크립트를 불러오지 못했습니다. [테마]에서 다른 테마를 고르세요.', true); };
  document.body.appendChild(s);
}

start();
</script>
</body>
